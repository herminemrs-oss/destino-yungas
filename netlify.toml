[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/que-son-las-yungas"
  to = "/que-son-las-yungas.html"
  status = 200
[[redirects]]
  from = "/mejor-epoca"
  to = "/mejor-epoca.html"
  status = 200
[[redirects]]
  from = "/como-llegar"
  to = "/como-llegar.html"
