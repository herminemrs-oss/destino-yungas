[[redirects]]
  from = "/precauciones"
  to = "/precauciones.html"
  status = 200
[[redirects]]
  from = "/itinerarios"
  to = "/itinerarios.html"
  status = 200
[[redirects]]
  from = "/parque-nacional-calilegua"
  to = "/parque-nacional-calilegua.html"
  status = 200
[[redirects]]
